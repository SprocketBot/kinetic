name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Local quality gate
        run: ./tools/quality-gate.sh

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: Race tests
        run: go test -race ./...

  web-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web/client
        run: npm ci

      - name: Lint
        working-directory: web/client
        run: npm run lint

      - name: Typecheck
        working-directory: web/client
        run: npm run typecheck

      - name: Unit tests
        working-directory: web/client
        run: npm run test

      - name: Install Playwright browsers
        working-directory: web/client
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: web/client
        run: npm run test:e2e

      - name: Build
        working-directory: web/client
        run: npm run build

  smoke-local:
    needs: [quality, web-client]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Run Week 14 local smoke
        run: ./tools/week14-smoke.sh
