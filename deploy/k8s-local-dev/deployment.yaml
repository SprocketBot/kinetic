apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprocket-v3-api
  namespace: sprocket-v3
  labels:
    app: sprocket-v3-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprocket-v3-api
  template:
    metadata:
      labels:
        app: sprocket-v3-api
    spec:
      containers:
        - name: api
          image: sprocket-v3-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sprocket-v3-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
