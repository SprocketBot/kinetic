  # ── API Tokens ─────────────────────────────────────────────────────────────
  /v1/api-tokens:
    get:
      operationId: listAPITokens
      summary: "List API tokens for the authenticated subject"
      tags:
        - api-tokens
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: "API tokens (hashed_token never returned)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          description: "Authentication required."
        "503":
          description: "API token store unavailable."
    post:
      operationId: createAPIToken
      summary: "Create a new API token"
      tags:
        - api-tokens
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
              required:
                - name
      responses:
        "201":
          description: "Created token. The plainTextToken field is only returned in this response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreateResponse"
        "400":
          description: "Invalid input."
        "401":
          description: "Authentication required."
        "503":
          description: "API token store unavailable."

  /v1/api-tokens/{id}:
    delete:
      operationId: revokeAPIToken
      summary: "Revoke an API token by ID"
      tags:
        - api-tokens
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Revoked token record."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIToken"
        "400":
          description: "Invalid token ID."
        "401":
          description: "Authentication required."
        "404":
          description: "Token not found or does not belong to the caller."
        "503":
          description: "API token store unavailable."

tags:
  - name: health
    description: "Liveness and readiness probes."
  - name: auth
