openapi: "3.1.0"

info:
  title: "Kinetic v3 API"
  version: "0.1.0"
  description: |
    REST API for the Kinetic v3 Rocket League esports league management platform.

    ## Authentication
    Most read endpoints are publicly accessible. Write and sensitive operations
    require authentication via either a session cookie (set by the OAuth login flow)
    or an HTTP Bearer token (API token issued via `/v1/api-tokens`).

    ## Permission model
    Protected routes enforce a resource/action pair checked against the caller's
    roles. Available resources are defined in `authz.resources` and include
    `league`, `franchise`, `club`, `team`, `player`, `roster_membership`,
    `role_assignment`, `queue`, `queue_entry`, `queue_ban`, `scrim`,
    `scrim_promotion`, `result_submission`, `result_override`, `replay_evidence`,
    `platform_account_link`, `player_rating`, `rating_adjustment`,
    `matchmaking_decision`, `exception_ticket`, `season`, `schedule_group`,
    `fixture`, `match`, `eligibility`, `player_stat`, `skill_group`,
    `skill_group_transition`, `organization_config`, `api_token`, and
    `player_notification`.

servers:
  - url: "http://localhost:8080"
    description: "Local development server"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kinetic_session
      description: "Signed session token set by the OAuth login flow."
    bearerToken:
      type: http
      scheme: bearer
      description: "Long-lived API token issued via POST /v1/api-tokens."

  schemas:
    # ── Utility ────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "kinetic-v3-api"
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - service
        - timestamp

    SessionPrincipal:
      type: object
      properties:
        subject:
          type: string
          description: "Unique identifier for the authenticated user (e.g. discord:<snowflake>)."
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
        - subject
        - displayName
        - roles

    # ── Hierarchy ──────────────────────────────────────────────────────────────
    League:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isActive
        - createdAt

    Franchise:
      type: object
      properties:
        id:
          type: integer
          format: int64
        leagueId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - leagueId
        - name
        - slug
        - isActive
        - createdAt

    Club:
      type: object
      properties:
        id:
          type: integer
          format: int64
        franchiseId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - franchiseId
        - name
        - slug
        - isActive
        - createdAt

    Team:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clubId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clubId
        - name
        - slug
        - isActive
        - createdAt

    Player:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - slug
        - isActive
        - createdAt

    RosterMembership:
      type: object
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - playerId
        - teamId
        - isActive
        - createdAt

    RoleAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        role:
          type: string
        franchiseId:
          type: integer
          format: int64
          nullable: true
        clubId:
          type: integer
          format: int64
          nullable: true
        teamId:
          type: integer
          format: int64
          nullable: true
        assignedByActorPlayerId:
          type: integer
          format: int64
        assignReason:
          type: string
        isActive:
          type: boolean
        assignedAt:
          type: string
          format: date-time
        revokedByActorPlayerId:
          type: integer
          format: int64
          nullable: true
        revokeReason:
          type: string
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - playerId
        - role
        - assignedByActorPlayerId
        - assignReason
        - isActive
        - assignedAt

    # ── Queue ──────────────────────────────────────────────────────────────────
    Queue:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isActive
        - createdAt

    QueueEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        queueId:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        isActive:
          type: boolean
        stage:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        stageAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - queueId
        - teamId
        - isActive
        - stage
        - createdAt
        - stageAt

    QueueBan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        queueId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        bannedByActor:
          type: string
        banReason:
          type: string
        isActive:
          type: boolean
        bannedAt:
          type: string
          format: date-time
        unbannedByActor:
          type: string
          nullable: true
        unbanReason:
          type: string
          nullable: true
        unbannedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - queueId
        - playerId
        - bannedByActor
        - banReason
        - isActive
        - bannedAt

    # ── Scrim ──────────────────────────────────────────────────────────────────
    Scrim:
      type: object
      properties:
        id:
          type: integer
          format: int64
        queueId:
          type: integer
          format: int64
        homeTeamId:
          type: integer
          format: int64
        awayTeamId:
          type: integer
          format: int64
        state:
          type: string
          description: "State machine value (e.g. popped, checked_in, in_progress, complete, cancelled)."
        lobbyName:
          type: string
          nullable: true
        lobbyPassword:
          type: string
          nullable: true
        poppedAt:
          type: string
          format: date-time
          nullable: true
        homeCheckedInAt:
          type: string
          format: date-time
          nullable: true
        awayCheckedInAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - queueId
        - homeTeamId
        - awayTeamId
        - state
        - createdAt

    ScrimMetrics:
      type: object
      properties:
        playersQueued:
          type: integer
          format: int32
        teamsInScrim:
          type: integer
          format: int32
        openScrims:
          type: integer
          format: int32
        scrimsClosedToday:
          type: integer
          format: int32
        avgWaitSecondsP50:
          type: number
          format: double
      required:
        - playersQueued
        - teamsInScrim
        - openScrims
        - scrimsClosedToday
        - avgWaitSecondsP50

    ProcessQueuePromotionsResult:
      type: object
      properties:
        processedQueues:
          type: integer
          format: int32
        promotionsCreated:
          type: integer
          format: int32
        conflicts:
          type: integer
          format: int32
        poppedScrimIds:
          type: array
          items:
            type: integer
            format: int64
      required:
        - processedQueues
        - promotionsCreated
        - conflicts
        - poppedScrimIds

    PromotionProcessingRun:
      type: object
      properties:
        id:
          type: integer
          format: int64
        queueId:
          type: integer
          format: int64
          nullable: true
        processedQueues:
          type: integer
          format: int32
        promotionsCreated:
          type: integer
          format: int32
        conflicts:
          type: integer
          format: int32
        durationMs:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - processedQueues
        - promotionsCreated
        - conflicts
        - durationMs
        - createdAt

    # ── Ratings ────────────────────────────────────────────────────────────────
    PlayerRating:
      type: object
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        contextKey:
          type: string
          description: "Opaque key identifying the rating context (e.g. queue slug)."
        rating:
          type: integer
          format: int32
        uncertainty:
          type: integer
          format: int32
        matchesPlayed:
          type: integer
          format: int32
        lastCompetedAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - playerId
        - contextKey
        - rating
        - uncertainty
        - matchesPlayed
        - isActive
        - updatedAt

    RatingAdjustment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actorPlayerId:
          type: integer
          format: int64
        targetPlayerId:
          type: integer
          format: int64
        contextKey:
          type: string
        previousRating:
          type: integer
          format: int32
        newRating:
          type: integer
          format: int32
        previousUncertainty:
          type: integer
          format: int32
        newUncertainty:
          type: integer
          format: int32
        previousMatchesPlayed:
          type: integer
          format: int32
        newMatchesPlayed:
          type: integer
          format: int32
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorPlayerId
        - targetPlayerId
        - contextKey
        - previousRating
        - newRating
        - previousUncertainty
        - newUncertainty
        - previousMatchesPlayed
        - newMatchesPlayed
        - reason
        - createdAt

    MatchmakingDecision:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scrimId:
          type: integer
          format: int64
        queueId:
          type: integer
          format: int64
        queueWaitSeconds:
          type: integer
          format: int32
        waitSkewSeconds:
          type: integer
          format: int32
        expansionStage:
          type: integer
          format: int32
        ratingSpread:
          type: integer
          format: int32
        homeTeamRating:
          type: integer
          format: int32
        awayTeamRating:
          type: integer
          format: int32
        crossGroup:
          type: boolean
        orderingStrategy:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - scrimId
        - queueId
        - queueWaitSeconds
        - waitSkewSeconds
        - expansionStage
        - ratingSpread
        - homeTeamRating
        - awayTeamRating
        - crossGroup
        - orderingStrategy
        - createdAt

    # ── Results ────────────────────────────────────────────────────────────────
    ResultSubmission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contextType:
          type: string
          description: "Either 'scrim' or 'match'."
        contextId:
          type: integer
          format: int64
        submittedByTeamId:
          type: integer
          format: int64
        homeTeamId:
          type: integer
          format: int64
        awayTeamId:
          type: integer
          format: int64
        winningTeamId:
          type: integer
          format: int64
        losingTeamId:
          type: integer
          format: int64
        state:
          type: string
          description: "Workflow state (e.g. pending, ratified, rejected, overridden)."
        payloadJson:
          description: "Arbitrary JSON payload attached to the submission."
        homeRatifiedAt:
          type: string
          format: date-time
          nullable: true
        awayRatifiedAt:
          type: string
          format: date-time
          nullable: true
        rejectedByTeamId:
          type: integer
          format: int64
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - contextType
        - contextId
        - submittedByTeamId
        - homeTeamId
        - awayTeamId
        - winningTeamId
        - losingTeamId
        - state
        - createdAt

    ResultOverride:
      type: object
      properties:
        id:
          type: integer
          format: int64
        submissionId:
          type: integer
          format: int64
        actor:
          type: string
        reason:
          type: string
        previousWinningTeamId:
          type: integer
          format: int64
        previousLosingTeamId:
          type: integer
          format: int64
        newWinningTeamId:
          type: integer
          format: int64
        newLosingTeamId:
          type: integer
          format: int64
        previousState:
          type: string
        newState:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - submissionId
        - actor
        - reason
        - previousWinningTeamId
        - previousLosingTeamId
        - newWinningTeamId
        - newLosingTeamId
        - previousState
        - newState
        - createdAt

    # ── Replay ─────────────────────────────────────────────────────────────────
    ReplayEvidence:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contextType:
          type: string
        contextId:
          type: integer
          format: int64
        submittedByTeamId:
          type: integer
          format: int64
        replaySha256:
          type: string
        contentSizeBytes:
          type: integer
          format: int64
        storageRef:
          type: string
        state:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - contextType
        - contextId
        - submittedByTeamId
        - replaySha256
        - contentSizeBytes
        - storageRef
        - state
        - createdAt

    ReplayParseRun:
      type: object
      properties:
        id:
          type: integer
          format: int64
        replayEvidenceId:
          type: integer
          format: int64
        parserName:
          type: string
        parserVersion:
          type: string
        parserConfigDigest:
          type: string
        status:
          type: string
        outputJson:
          description: "Raw parsed output from the replay parser."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - replayEvidenceId
        - parserName
        - parserVersion
        - parserConfigDigest
        - status
        - createdAt

    ReplayIngestionResult:
      type: object
      properties:
        evidence:
          $ref: "#/components/schemas/ReplayEvidence"
        parseRun:
          $ref: "#/components/schemas/ReplayParseRun"
        duplicate:
          type: boolean
        linkedSubmissionId:
          type: integer
          format: int64
          nullable: true
      required:
        - evidence
        - parseRun
        - duplicate

    ResultSubmissionReplayLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resultSubmissionId:
          type: integer
          format: int64
        replayEvidenceId:
          type: integer
          format: int64
        linkedByTeamId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - resultSubmissionId
        - replayEvidenceId
        - linkedByTeamId
        - createdAt

    # ── Stats ──────────────────────────────────────────────────────────────────
    PlayerStatLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roundId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
          nullable: true
        replayIdentity:
          type: string
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        shots:
          type: integer
          format: int32
        score:
          type: integer
          format: int32
        opi:
          type: number
          format: double
          description: "Offensive performance index."
        dpi:
          type: number
          format: double
          description: "Defensive performance index."
        gpi:
          type: number
          format: double
          description: "General performance index (opi + dpi)."
      required:
        - id
        - roundId
        - replayIdentity
        - goals
        - assists
        - saves
        - shots
        - score
        - opi
        - dpi
        - gpi

    PlayerCareerStats:
      type: object
      properties:
        playerId:
          type: integer
          format: int64
        totalGames:
          type: integer
          format: int32
        totalGoals:
          type: integer
          format: int32
        totalAssists:
          type: integer
          format: int32
        totalSaves:
          type: integer
          format: int32
        totalShots:
          type: integer
          format: int32
        avgOpi:
          type: number
          format: double
        avgDpi:
          type: number
          format: double
        avgGpi:
          type: number
          format: double
      required:
        - playerId
        - totalGames
        - totalGoals
        - totalAssists
        - totalSaves
        - totalShots
        - avgOpi
        - avgDpi
        - avgGpi

    # ── Exceptions ─────────────────────────────────────────────────────────────
    ExceptionTicket:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        contextType:
          type: string
        contextId:
          type: integer
          format: int64
        reportedByTeamId:
          type: integer
          format: int64
          nullable: true
        state:
          type: string
        reasonCode:
          type: string
        severity:
          type: integer
          format: int32
        suggestedAction:
          type: string
        detailsJson:
          description: "Arbitrary JSON details for the exception."
        resolutionCode:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
        triagedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - category
        - contextType
        - contextId
        - state
        - reasonCode
        - severity
        - suggestedAction
        - openedAt

    ExceptionAction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ticketId:
          type: integer
          format: int64
        actionType:
          type: string
        actor:
          type: string
        automated:
          type: boolean
        notes:
          type: string
        minutesSpent:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ticketId
        - actionType
        - actor
        - automated
        - notes
        - minutesSpent
        - createdAt

    ExceptionMetrics:
      type: object
      properties:
        adminHoursPerWeek:
          type: number
          format: double
        manualTouchesPerFixture:
          type: number
          format: double
        zeroTouchFixtureRate:
          type: number
          format: double
        timeToCloseHoursP50:
          type: number
          format: double
      required:
        - adminHoursPerWeek
        - manualTouchesPerFixture
        - zeroTouchFixtureRate
        - timeToCloseHoursP50

    ExceptionAutomationResult:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/ExceptionTicket"
        autoResolved:
          type: boolean
      required:
        - ticket
        - autoResolved

    # ── Scheduling ─────────────────────────────────────────────────────────────
    Season:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isActive
        - createdAt

    ScheduleGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        seasonId:
          type: integer
          format: int64
        name:
          type: string
        sequence:
          type: integer
          format: int32
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - seasonId
        - name
        - sequence
        - isActive
        - createdAt

    Fixture:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scheduleGroupId:
          type: integer
          format: int64
        homeClubId:
          type: integer
          format: int64
        awayClubId:
          type: integer
          format: int64
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - scheduleGroupId
        - homeClubId
        - awayClubId
        - isActive
        - createdAt

    Match:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fixtureId:
          type: integer
          format: int64
        homeTeamId:
          type: integer
          format: int64
        awayTeamId:
          type: integer
          format: int64
        state:
          type: string
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        homeTimeRatifiedAt:
          type: string
          format: date-time
          nullable: true
        awayTimeRatifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fixtureId
        - homeTeamId
        - awayTeamId
        - state
        - createdAt

    # ── Skill Groups ───────────────────────────────────────────────────────────
    SkillGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        leagueId:
          type: integer
          format: int64
        name:
          type: string
        displayOrder:
          type: integer
          format: int32
        ratingFloor:
          type: integer
          format: int32
        ratingCeiling:
          type: integer
          format: int32
        promotionThreshold:
          type: integer
          format: int32
          nullable: true
        demotionThreshold:
          type: integer
          format: int32
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - leagueId
        - name
        - displayOrder
        - ratingFloor
        - ratingCeiling
        - isActive
        - createdAt

    SkillGroupTransition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        fromSkillGroupId:
          type: integer
          format: int64
          nullable: true
        toSkillGroupId:
          type: integer
          format: int64
        ratingAtTransition:
          type: integer
          format: int32
        direction:
          type: string
          description: "Either 'promotion' or 'demotion'."
        effectiveAt:
          type: string
          format: date-time
      required:
        - id
        - playerId
        - toSkillGroupId
        - ratingAtTransition
        - direction
        - effectiveAt

    # ── Org Config ─────────────────────────────────────────────────────────────
    OrgConfig:
      type: object
      properties:
        id:
          type: integer
          format: int64
        leagueId:
          type: integer
          format: int64
        key:
          type: string
          description: >
            One of: scrim.pop_timeout_minutes, scrim.queue_ban_initial_duration_minutes,
            scrim.queue_ban_duration_modifier, scrim.queue_ban_modifier_falloff_days,
            scrim.required_ratifications, queue.expansion_interval_seconds.
        value:
          type: string
        updatedBy:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - leagueId
        - key
        - value
        - updatedAt

    # ── Platform Accounts ──────────────────────────────────────────────────────
    PlatformAccountLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subject:
          type: string
        provider:
          type: string
          description: "OAuth provider identifier (e.g. 'discord')."
        providerAccountId:
          type: string
        providerAccountName:
          type: string
        isActive:
          type: boolean
        linkedAt:
          type: string
          format: date-time
        unlinkedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - subject
        - provider
        - providerAccountId
        - providerAccountName
        - isActive
        - linkedAt

    # ── Eligibility ────────────────────────────────────────────────────────────
    EligibilityProjectionPoint:
      type: object
      properties:
        effectiveAt:
          type: string
          format: date-time
        points:
          type: integer
          format: int32
        isEligible:
          type: boolean
      required:
        - effectiveAt
        - points
        - isEligible

    EligibilityStatus:
      type: object
      properties:
        subject:
          type: string
        points:
          type: integer
          format: int32
        thresholdPoints:
          type: integer
          format: int32
        decayPerWeek:
          type: integer
          format: int32
        eligibleUntil:
          type: string
          format: date-time
        evaluatedAt:
          type: string
          format: date-time
        projection:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityProjectionPoint"
      required:
        - subject
        - points
        - thresholdPoints
        - decayPerWeek
        - eligibleUntil
        - evaluatedAt
        - projection

    # ── Notifications ──────────────────────────────────────────────────────────
    PlayerNotification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        category:
          type: string
          description: >
            One of: scrim_popped, queue_ban, ratification_needed,
            skill_group_change, roster_change.
        contextType:
          type: string
          nullable: true
        contextId:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - playerId
        - category
        - message
        - createdAt

    # ── API Tokens ─────────────────────────────────────────────────────────────
    APIToken:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tokenPrefix:
          type: string
          description: "First few characters of the token, shown for identification only."
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: integer
          format: int64
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - tokenPrefix
        - subject
        - scopes
        - createdAt

    APITokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          properties:
            plainTextToken:
              type: string
              description: "The raw token value. Only returned once at creation time."
          required:
            - plainTextToken

    # ── Provider info ──────────────────────────────────────────────────────────
    ProviderInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
      required:
        - id
        - name
        - enabled

# =============================================================================
# Paths
# =============================================================================
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getHealth
      summary: "Liveness probe"
      tags:
        - health
      responses:
        "200":
          description: "Service is alive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReady
      summary: "Readiness probe"
      tags:
        - health
      responses:
        "200":
          description: "Service is ready to accept traffic."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /v1/auth/providers:
    get:
      operationId: listAuthProviders
      summary: "List configured OAuth providers"
      tags:
        - auth
      responses:
        "200":
          description: "List of providers."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderInfo"

  /v1/auth/login:
    get:
      operationId: authLogin
      summary: "Initiate OAuth login flow"
      tags:
        - auth
      parameters:
        - name: provider
          in: query
          required: false
          description: "OAuth provider to use. Defaults to local/dev flow."
          schema:
            type: string
            enum:
              - discord
              - local
        - name: subject
          in: query
          required: false
          description: "Subject override for local/dev flow."
          schema:
            type: string
        - name: displayName
          in: query
          required: false
          schema:
            type: string
        - name: roles
          in: query
          required: false
          description: "Comma-separated roles for local/dev flow."
          schema:
            type: string
        - name: redirect
          in: query
          required: false
          description: "URL to redirect to after login."
          schema:
            type: string
      responses:
        "302":
          description: "Redirects to the OAuth provider or to the callback for local flow."
        "400":
          description: "Unknown provider."
        "501":
          description: "Provider not configured."

  /v1/auth/callback:
    get:
      operationId: authCallback
      summary: "OAuth callback — exchanges code for session cookie"
      tags:
        - auth
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: "Authorization code from OAuth provider."
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: "CSRF state parameter."
          schema:
            type: string
        - name: redirect
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: "Redirects to the web app after setting session cookie."
        "400":
          description: "Invalid state or missing code."
        "502":
          description: "OAuth provider error."

  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: "Clear the session cookie"
      tags:
        - auth
      responses:
        "204":
          description: "Session cookie cleared."

  /v1/session:
    get:
      operationId: getSession
      summary: "Get current authenticated principal"
      tags:
        - auth
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Current session principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPrincipal"
        "401":
          description: "Not authenticated."

  /v1/admin/ping:
    get:
      operationId: adminPing
      summary: "Admin liveness check — verifies authentication and admin.ping permission"
      tags:
        - auth
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  subject:
                    type: string
        "401":
          description: "Not authenticated."
        "403":
          description: "Insufficient permissions."

  # ── Hierarchy: Leagues ─────────────────────────────────────────────────────
  /v1/leagues:
    get:
      operationId: listLeagues
      summary: "List all leagues"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All leagues."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createLeague
      summary: "Create a new league"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
              required:
                - name
                - slug
      responses:
        "201":
          description: "Created league."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict (duplicate slug)."
        "503":
          description: "Hierarchy store unavailable."

  # ── Hierarchy: Franchises ──────────────────────────────────────────────────
  /v1/franchises:
    get:
      operationId: listFranchises
      summary: "List all franchises"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All franchises."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Franchise"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createFranchise
      summary: "Create a new franchise"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leagueId:
                  type: integer
                  format: int64
                name:
                  type: string
                slug:
                  type: string
              required:
                - leagueId
                - name
                - slug
      responses:
        "201":
          description: "Created franchise."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Franchise"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  # ── Hierarchy: Clubs ───────────────────────────────────────────────────────
  /v1/clubs:
    get:
      operationId: listClubs
      summary: "List all clubs"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All clubs."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createClub
      summary: "Create a new club"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                franchiseId:
                  type: integer
                  format: int64
                name:
                  type: string
                slug:
                  type: string
              required:
                - franchiseId
                - name
                - slug
      responses:
        "201":
          description: "Created club."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  # ── Hierarchy: Teams ───────────────────────────────────────────────────────
  /v1/teams:
    get:
      operationId: listTeams
      summary: "List all teams"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All teams."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createTeam
      summary: "Create a new team"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clubId:
                  type: integer
                  format: int64
                name:
                  type: string
                slug:
                  type: string
              required:
                - clubId
                - name
                - slug
      responses:
        "201":
          description: "Created team."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  # ── Hierarchy: Players ─────────────────────────────────────────────────────
  /v1/players:
    get:
      operationId: listPlayers
      summary: "List all players"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All players."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createPlayer
      summary: "Create a new player"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                slug:
                  type: string
              required:
                - displayName
                - slug
      responses:
        "201":
          description: "Created player."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  /v1/players/{id}/activate:
    post:
      operationId: activatePlayer
      summary: "Mark a player as active"
      tags:
        - hierarchy
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Updated player."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: "Invalid player ID."
        "401":
          description: "Not authenticated."
        "403":
          description: "Insufficient permissions (player:update required)."
        "503":
          description: "Hierarchy store unavailable."

  /v1/players/{id}/deactivate:
    post:
      operationId: deactivatePlayer
      summary: "Mark a player as inactive"
      tags:
        - hierarchy
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Updated player."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: "Invalid player ID."
        "401":
          description: "Not authenticated."
        "403":
          description: "Insufficient permissions (player:update required)."
        "503":
          description: "Hierarchy store unavailable."

  /v1/players/{id}/career-stats:
    get:
      operationId: getPlayerCareerStats
      summary: "Get career-aggregate stats for a player"
      tags:
        - replay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Career stats."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCareerStats"
        "400":
          description: "Invalid player ID."
        "503":
          description: "Replay stats store unavailable."

  /v1/players/{id}/skill-group-transitions:
    get:
      operationId: listPlayerSkillGroupTransitions
      summary: "List skill-group transitions for a player"
      tags:
        - skill-groups
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "Transitions."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillGroupTransition"
        "400":
          description: "Invalid player ID."
        "503":
          description: "Skill group store unavailable."

  # ── Hierarchy: Roster memberships ──────────────────────────────────────────
  /v1/roster-memberships:
    get:
      operationId: listRosterMemberships
      summary: "List all roster memberships"
      tags:
        - hierarchy
      responses:
        "200":
          description: "All roster memberships."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterMembership"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: createRosterMembership
      summary: "Add a player to a team roster"
      tags:
        - hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: integer
                  format: int64
                teamId:
                  type: integer
                  format: int64
              required:
                - playerId
                - teamId
      responses:
        "201":
          description: "Created membership."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterMembership"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  # ── Roles ──────────────────────────────────────────────────────────────────
  /v1/role-assignments:
    get:
      operationId: listRoleAssignments
      summary: "List all role assignments"
      tags:
        - roles
      responses:
        "200":
          description: "All role assignments."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
        "503":
          description: "Hierarchy store unavailable."
    post:
      operationId: assignRole
      summary: "Assign a role to a player"
      tags:
        - roles
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorPlayerId:
                  type: integer
                  format: int64
                targetPlayerId:
                  type: integer
                  format: int64
                role:
                  type: string
                franchiseId:
                  type: integer
                  format: int64
                  nullable: true
                clubId:
                  type: integer
                  format: int64
                  nullable: true
                teamId:
                  type: integer
                  format: int64
                  nullable: true
                reason:
                  type: string
              required:
                - actorPlayerId
                - targetPlayerId
                - role
                - reason
      responses:
        "201":
          description: "Created role assignment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: "Invalid input."
        "401":
          description: "Not authenticated."
        "403":
          description: "Insufficient permissions (role_assignment:create required)."
        "409":
          description: "Conflict."
        "503":
          description: "Hierarchy store unavailable."

  /v1/role-assignments/revoke:
    post:
      operationId: revokeRole
      summary: "Revoke an existing role assignment"
      tags:
        - roles
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorPlayerId:
                  type: integer
                  format: int64
                assignmentId:
                  type: integer
                  format: int64
                reason:
                  type: string
              required:
                - actorPlayerId
                - assignmentId
                - reason
      responses:
        "200":
          description: "Revoked role assignment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: "Invalid input."
        "401":
          description: "Not authenticated."
        "403":
          description: "Insufficient permissions (role_assignment:revoke required)."
        "503":
          description: "Hierarchy store unavailable."

  # ── Platform Accounts ──────────────────────────────────────────────────────
  /v1/platform-accounts:
    get:
      operationId: listPlatformAccounts
      summary: "List platform account links for a subject"
      tags:
        - platform-accounts
      parameters:
        - name: subject
          in: query
          required: false
          description: "Subject to look up. Defaults to the session principal's subject."
          schema:
            type: string
      responses:
        "200":
          description: "Platform account links."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAccountLink"
        "400":
          description: "Subject is required and could not be determined."
        "503":
          description: "Hierarchy store unavailable."

  /v1/platform-accounts/link:
    post:
      operationId: linkPlatformAccount
      summary: "Link a platform account (e.g. Discord) to a subject"
      tags:
        - platform-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: "Defaults to the session principal's subject when omitted."
                provider:
                  type: string
                providerAccountId:
                  type: string
                providerAccountName:
                  type: string
              required:
                - provider
                - providerAccountId
                - providerAccountName
      responses:
        "201":
          description: "Created link."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccountLink"
        "400":
          description: "Invalid input."
        "409":
          description: "Conflict (account already linked)."
        "503":
          description: "Hierarchy store unavailable."

  /v1/platform-accounts/unlink:
    post:
      operationId: unlinkPlatformAccount
      summary: "Unlink a platform account from a subject"
      tags:
        - platform-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: "Defaults to the session principal's subject when omitted."
                provider:
                  type: string
                providerAccountId:
                  type: string
              required:
                - provider
                - providerAccountId
      responses:
        "200":
          description: "Unlinked account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccountLink"
        "400":
          description: "Invalid input."
        "503":
          description: "Hierarchy store unavailable."

  # ── Eligibility ────────────────────────────────────────────────────────────
  /v1/eligibility:
    get:
      operationId: getEligibility
      summary: "Get eligibility status for a subject"
      tags:
        - eligibility
      parameters:
        - name: subject
          in: query
          required: false
          description: "Subject to look up. Defaults to the session principal's subject."
          schema:
            type: string
      responses:
        "200":
          description: "Eligibility status."
